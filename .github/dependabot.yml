version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '04:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: ping
        versions:
          - 0.4.0
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
